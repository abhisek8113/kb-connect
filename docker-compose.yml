# Kongu Brilliance Connect — local / small-prod stack.
# Jitsi is run as its OWN docker-jitsi-meet stack (see docs/DEPLOYMENT.md) so
# that video scales independently; this compose covers the app + database.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kb}
      POSTGRES_DB: kbconnect
    volumes:
      - kbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kbconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://kb:${DB_PASSWORD:-kb}@db:5432/kbconnect
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a strong secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set a strong secret}
      JITSI_DOMAIN: ${JITSI_DOMAIN:?set your jitsi domain}
      JITSI_APP_ID: ${JITSI_APP_ID:-kbconnect}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:?set your jitsi secret}
    ports:
      - "4000:4000"
    command: sh -c "node src/migrate.js && node src/seed.js && node src/seed_ai.js && node src/index.js"

volumes:
  kbdata:
